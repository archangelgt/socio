name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy tools
        run: sudo apt-get update && sudo apt-get install -y rsync dnsutils

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_SSH_KEY:-}" ]; then
            echo "Missing secret DEPLOY_SSH_KEY" >&2
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          KEY_FILE="$HOME/.ssh/id_ed25519"
          # Prefer real multiline secret; fall back if pasted with literal \n
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
          chmod 600 "$KEY_FILE"
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            printf '%b\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$KEY_FILE"
            chmod 600 "$KEY_FILE"
          fi
          if ! ssh-keygen -y -f "$KEY_FILE" >/dev/null 2>&1; then
            echo "DEPLOY_SSH_KEY is not a valid OpenSSH private key." >&2
            echo "Re-paste the full key (BEGIN…END) as a multiline Actions secret." >&2
            exit 1
          fi
          {
            echo "Host 146.190.132.169"
            echo "  User root"
            echo "  IdentityFile $KEY_FILE"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          ssh-keyscan -H 146.190.132.169 >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          ssh -o BatchMode=yes root@146.190.132.169 'echo ssh_ok'

      - name: Deploy to socio.seraphsystems.com
        env:
          DEPLOY_HOST: root@146.190.132.169
        run: ./scripts/deploy.sh

      - name: Verify health
        run: curl -fsS https://socio.seraphsystems.com/health
