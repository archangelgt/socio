# socio.seraphsystems.com — edge vhost on erpsys-nginx
# Isolated file. Do not edit other conf.d files.

upstream socio_web {
    server socio-web:80 fail_timeout=0;
}

server {
    listen 80;
    server_name socio.seraphsystems.com;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        return 301 https://socio.seraphsystems.com$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name socio.seraphsystems.com;

    ssl_certificate     /etc/nginx/ssl/socio/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/socio/privkey.pem;
    include /etc/nginx/conf.d/ssl-params.conf;

    client_max_body_size 16m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /var/www/certbot;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Cookie $http_cookie;
        proxy_read_timeout 120;
        proxy_pass http://socio_web;
    }
}
