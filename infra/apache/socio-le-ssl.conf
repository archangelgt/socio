# socio.seraphsystems.com — HTTPS → Docker 127.0.0.1:8090
# Isolated vhost. Do not edit other conf.d files.

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName socio.seraphsystems.com
    ServerAdmin gmorales@seraphsystems.com

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    ProxyPreserveHost On
    ProxyRequests Off
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port "443"

    ProxyPass /.well-known/acme-challenge/ !
    ProxyPass / http://127.0.0.1:8090/
    ProxyPassReverse / http://127.0.0.1:8090/

    ErrorLog /var/log/httpd/socio.seraphsystems.com-ssl-error.log
    CustomLog /var/log/httpd/socio.seraphsystems.com-ssl-access.log combined

    SSLCertificateFile /etc/letsencrypt/live/socio.seraphsystems.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/socio.seraphsystems.com/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
