# socio.seraphsystems.com — HTTP
# Isolated vhost. Do not edit other conf.d files.

<VirtualHost *:80>
    ServerName socio.seraphsystems.com
    ServerAdmin gmorales@seraphsystems.com

    Alias /.well-known/acme-challenge/ /var/www/letsencrypt/.well-known/acme-challenge/
    <Directory /var/www/letsencrypt/.well-known/acme-challenge/>
        Options None
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

    ErrorLog /var/log/httpd/socio.seraphsystems.com-error.log
    CustomLog /var/log/httpd/socio.seraphsystems.com-access.log combined
</VirtualHost>
